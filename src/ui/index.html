<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CatOS AutoCodex</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">│ CatOS AutoCodex │ <span id="runNo">RUN #-</span> │ <span id="status">idle</span> │ <span id="elapsed">00:00</span> │</header>
  <main class="commander-grid">
    <section class="panel setup-panel">
      <h2>┌─ SETUP ─────────────────────┐</h2>
      <label><span>Repository</span><select id="repository"></select></label>
      <button id="refresh" type="button">refresh</button>
      <button id="clone" type="button" hidden>clone</button>
      <label><span>Repository path</span><input id="repositoryPath" readonly></label>
      <label><span>Base branch</span><select id="base"></select></label>
      <label><span>PR target</span><select id="target"></select></label>
      <label><span>Task</span><textarea id="task"></textarea></label>
      <p id="runReason" class="message"></p>
      <button id="run">RUN</button>
    </section>
    <section class="panel run-panel">
      <h2>┌─ RUN ─────────────────────────────────────────────────────────┐</h2>
      <div id="currentStep" class="current-step" hidden></div>
      <table>
        <thead><tr><th>#</th><th>STEP</th><th>STATUS</th><th>OUTPUT</th><th>TIME</th></tr></thead>
        <tbody id="timeline"></tbody>
      </table>
      <div id="system"></div>
      <button id="stop" hidden>STOP</button>
    </section>
    <section class="panel output-panel">
      <h2>┌─ OUTPUT ───────────────────────────────────────┐</h2>
      <div class="viewer-actions"><div id="viewerTitle">No output selected</div><button id="copy">copy</button></div>
      <pre id="viewer" readonly></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
