<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CatOS AutoCodex</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">CatOS AutoCodex | <span id="runNo">RUN #-</span> | <span id="status">idle</span> | <span id="elapsed">00:00</span></header>
  <main class="app-layout">
    <section class="setup-panel">
      <h2>SETUP</h2>
      <div class="repository-block">
        <label for="repository">Git repository</label>
        <select id="repository"></select>
        <code id="selectedRepositoryName" class="value-readout">No repository selected</code>
      </div>
      <div class="branch-row">
        <label class="branch-field" for="branch"><span>Branch</span><select id="branch"></select></label>
        <button id="clone" class="primary" type="button">CLONE BRANCH</button>
      </div>
      <div class="checkout-summary">
        <p id="branchStatus" class="message branch-message"></p>
        <div><strong>Local clone:</strong> <div id="repositoryPath" class="value-readout" tabindex="0">not cloned</div></div>
        <div><strong>Base branch:</strong> <span id="baseBranch" class="value-readout inline-readout">-</span></div>
        <div><strong>Snapshot:</strong> automatic on RUN</div>
      </div>
      <label class="task-field" for="task"><span>Task</span><textarea id="task"></textarea></label>
      <p id="runReason" class="message" role="status" aria-live="polite"></p>
      <div class="run-actions">
        <button id="run" class="primary" type="button">RUN</button>
        <button id="stop" type="button" disabled>STOP</button>
      </div>
    </section>
    <section class="execution-panel">
      <section class="run-panel">
        <h2>RUN</h2>
        <div class="timeline-wrap"><div id="timeline" class="timeline-list"></div></div>
      </section>
      <section class="output-panel">
        <h2>OUTPUT</h2>
        <div class="output-file-row"><strong id="viewerTitle">FINAL_REPORT.md</strong><div class="output-actions"><button id="copy" type="button" disabled>COPY</button><button id="download" type="button" disabled>DOWNLOAD</button></div></div><div id="copyStatus" class="message"></div>
      </section>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
