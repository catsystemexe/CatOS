project:
  id: demo
  name: Demo project
  repoPath: /tmp/catos-codex-demo
  baseBranch: main
commands:
  typecheck: npm run typecheck
  test: npm run test
  build: npm run build
workflow:
  maxReworkAttempts: 2
  createCommit: false
permissions:
  allowNetwork: false
  allowPush: false
  allowMerge: false
codex:
  sandboxMode: danger-full-access
  acknowledgeNoSandbox: true
